<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Лабораторна робота №2 з основ Front-end технологій: таблиця HTML5 з об'єднаними комірками та прапор Японії засобами CSS (position і transform). Крошка Д. О., ІМ-44, варіант 59.">
  <meta name="keywords" content="HTML5, CSS3, таблиця, colspan, rowspan, hover, position, transform, прапор Японії, ІМ-44">
  <meta name="author" content="Крошка Дар'я Олександрівна">
  <title>Крошка Д. О., ІМ-44 — ЛР2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Завдання 1: стилі таблиці (за умовою — у цьому ж файлі) */
    .lab-table {
      border-collapse: collapse;
      table-layout: fixed;
      width: 100%;
      max-width: 720px;
      font-size: 1.1rem;
    }
    /* Пропорції стовпців як на схемі варіанту 9: 2 : 2 : 2 : 1 : 1 */
    .lab-table .col-wide {
      width: 25%;
    }
    .lab-table .col-narrow {
      width: 12.5%;
    }

    .lab-table tr {
      height: 2.75rem;
    }
    .lab-table td {
      border: 2px solid #1a1a1a;
      padding: 0.25rem 0.5rem;
      vertical-align: middle;
    }
    /* 1-й рядок: #nn8f8f, 2-й рядок: #f5f5nn, nn = 59 */
    .lab-table tr:nth-child(1) {
      background-color: #598f8f;
      color: #051010;
    }
    .lab-table tr:nth-child(2) {
      background-color: #f5f559;
      color: #4a4a00;
    }
    /* При наведенні кольори змінюються на протилежні — рядки обмінюються кольорами */
    .lab-table tr:nth-child(1):hover {
      background-color: #f5f559;
      color: #4a4a00;
    }
    .lab-table tr:nth-child(2):hover {
      background-color: #598f8f;
      color: #051010;
    }
  </style>
</head>
<body>
  <main>
    <h1>Лабораторна робота №2</h1>

    <h2>Завдання 1. Таблиця (варіант 9)</h2>
    <table class="lab-table">
      <colgroup>
        <col class="col-wide" span="3">
        <col class="col-narrow" span="2">
      </colgroup>
      <tr>
        <td colspan="2" rowspan="2">Крошка</td>
        <td colspan="3">Дар'я</td>
      </tr>
      <tr>
        <td rowspan="2">Олександрівна</td>
        <td rowspan="3">ІМ-44</td>
        <td rowspan="3">ЛР-2 Варіант 59</td>
      </tr>
      <tr>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </table>

    <h2>Завдання 2. Прапор Японії (варіант 9)</h2>
    <div class="flags">
      <figure>
        <div class="flag flag--position" role="img" aria-label="Прапор Японії, побудований за допомогою position">
          <div class="flag__disc"></div>
        </div>
        <figcaption>1. За допомогою <code>position</code></figcaption>
      </figure>
      <figure>
        <div class="flag flag--transform" role="img" aria-label="Прапор Японії, побудований за допомогою transform">
          <div class="flag__disc"></div>
        </div>
        <figcaption>2. За допомогою <code>transform</code></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
